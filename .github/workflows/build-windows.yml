name: Сборка Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Сборка exe
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Tactic-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Передвинуть тег latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Релиз «latest» (ветка main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tactic (последняя сборка)
          prerelease: true
          make_latest: false
          body: Автоматическая сборка из ветки main, коммит ${{ github.sha }}.
          files: release/*.exe

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
